[project]
name = "kse-grid"
version = "0.1.0"
description = "Interaktywny plotter sieci elektroenergetycznej dla plików MATPOWER (.m)"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "matpowercaseframes>=2.1.0",
    "pandapower>=3.4.0",
    "pandas-stubs~=2.3.3",
    "python-multipart>=0.0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
